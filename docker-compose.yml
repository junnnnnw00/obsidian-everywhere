# Lab-server deployment (Host 2 in docs/architecture.md's topology).
#
# Two independent services share the same vault:
#
#   obsidian-everywhere       — static bearer token Remote Vault Bridge,
#                                reached over a private network or through a
#                                TLS-terminating tunnel. Do NOT publish this
#                                plaintext port directly.
#
#   obsidian-everywhere-oauth — OAuth 2.1, for the claude.ai web/mobile
#                                custom connector. This one is meant to be
#                                fronted by a public HTTPS reverse proxy
#                                (Cloudflare Tunnel — see docs/deploy.md).
#                                Comment it out if you don't need the
#                                claude.ai connector.
#
# Configure secrets in a sibling `.env` file (see `.env.example`).

services:
  obsidian-everywhere:
    build: .
    image: obsidian-everywhere:latest
    command: ["node", "dist/http-cli.js"]
    restart: unless-stopped
    ports:
      - "3737:3737"
    environment:
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_EVERYWHERE_DB: /vault/.obsidian-everywhere/index-http.db
      # Keep service-specific secrets optional during Compose interpolation so
      # `docker compose up obsidian-everywhere-oauth` does not also require the
      # bearer service's token. The selected process validates its own secret.
      OBSIDIAN_EVERYWHERE_TOKEN: ${OBSIDIAN_EVERYWHERE_TOKEN:-}
      OBSIDIAN_EVERYWHERE_READONLY: ${OBSIDIAN_EVERYWHERE_READONLY:-false}
      OBSIDIAN_EVERYWHERE_GIT_MODE: ${OBSIDIAN_EVERYWHERE_HTTP_GIT_MODE:-off}
      OBSIDIAN_EVERYWHERE_GIT_REPO_PATH: ${OBSIDIAN_EVERYWHERE_HTTP_GIT_REPO_PATH-.}
      OBSIDIAN_EVERYWHERE_GIT_ALLOWED_PUSH_REMOTES: ${OBSIDIAN_EVERYWHERE_HTTP_GIT_ALLOWED_PUSH_REMOTES:-}
      OBSIDIAN_EVERYWHERE_MOUNT_GUARD: ${OBSIDIAN_EVERYWHERE_MOUNT_GUARD:-false}
      OBSIDIAN_EVERYWHERE_MOUNT_SENTINEL: ${OBSIDIAN_EVERYWHERE_MOUNT_SENTINEL:-}
      PORT: "3737"
    volumes:
      - ${OBSIDIAN_VAULT_HOST_PATH:?set your vault's host path in .env}:/vault

  obsidian-everywhere-oauth:
    build: .
    image: obsidian-everywhere:latest
    command: ["node", "dist/oauth-http-cli.js"]
    restart: unless-stopped
    ports:
      - "3738:3738"
    environment:
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_EVERYWHERE_DB: /vault/.obsidian-everywhere/index-oauth.db
      # These stay optional at interpolation time for the inverse reason: a
      # bearer-only deployment must not need OAuth configuration. The OAuth
      # process fails closed at startup if either selected value is missing.
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      OAUTH_LOGIN_SECRET: ${OAUTH_LOGIN_SECRET:-}
      OAUTH_ENABLE_WRITE_TOOLS: ${OAUTH_ENABLE_WRITE_TOOLS:-false}
      # Keep the public OAuth connector's Git capability independent from the
      # bearer service. It remains off unless this service is opted in itself.
      OBSIDIAN_EVERYWHERE_GIT_MODE: ${OBSIDIAN_EVERYWHERE_OAUTH_GIT_MODE:-off}
      OBSIDIAN_EVERYWHERE_GIT_REPO_PATH: ${OBSIDIAN_EVERYWHERE_OAUTH_GIT_REPO_PATH-.}
      OBSIDIAN_EVERYWHERE_GIT_ALLOWED_PUSH_REMOTES: ${OBSIDIAN_EVERYWHERE_OAUTH_GIT_ALLOWED_PUSH_REMOTES:-}
      OBSIDIAN_EVERYWHERE_MOUNT_GUARD: ${OBSIDIAN_EVERYWHERE_MOUNT_GUARD:-false}
      OBSIDIAN_EVERYWHERE_MOUNT_SENTINEL: ${OBSIDIAN_EVERYWHERE_MOUNT_SENTINEL:-}
      PORT: "3738"
    volumes:
      - ${OBSIDIAN_VAULT_HOST_PATH:?set your vault's host path in .env}:/vault
