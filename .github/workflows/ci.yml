name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify package contents
        if: matrix.node-version == '22.x'
        run: npm pack --dry-run

      - name: Test
        run: npm test

  git-integration:
    name: Git integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test guarded Git workflows
        run: npx vitest run src/git/vault-git.test.ts src/mcp/git-tools.test.ts

  docker-image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build image
        run: docker build --tag obsidian-everywhere:ci .

      - name: Smoke-test runtime dependencies
        run: |
          docker run --rm --entrypoint sh obsidian-everywhere:ci -c '
            git --version &&
            node -e "require(\"better-sqlite3\")" &&
            ! command -v g++ &&
            ! command -v make &&
            ! command -v python3
          '
